# Old domains: send every visit to dev.pictures (permanent redirect, so search engines move over too).
[[redirects]]
  from = "https://devbowman.co/*"
  to = "https://dev.pictures/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.devbowman.co/*"
  to = "https://dev.pictures/"
  status = 301
  force = true
