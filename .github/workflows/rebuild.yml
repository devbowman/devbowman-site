# Rebuilds the site every few hours so new ONE HOUR PHOTO posts show up.
# Needs the repository secret CF_DEPLOY_HOOK (the Cloudflare Pages deploy hook URL).
name: Scheduled rebuild
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Cloudflare Pages to rebuild
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_DEPLOY_HOOK is not set yet"; exit 0; fi
          curl -fsS -X POST "$HOOK"
